name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Üretim bağımlılıklarında high ve üzeri açık varsa build kırılır.
      # Dev bağımlılıkları (electron-builder zinciri) bilinçli olarak hariç.
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
